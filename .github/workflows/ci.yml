name: CommonGround CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify backend syntax
        run: |
          node --check server/core.js
          node --check scripts/migrate.mjs
          node --check api/cases.js
          node --check api/events.js
          node --check api/auth/request.js
          node --check api/auth/verify.js
          node --check api/auth/logout.js
      - name: Run unit and PostgreSQL-compatible integration tests
        run: npm test
      - name: Build browser bundle
        run: npm run build
